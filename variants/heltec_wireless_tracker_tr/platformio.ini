; TrackBridge: the Heltec Wireless Tracker build with Turkish text on the tracker's own screen
; (and, via tools/tb_translate/web_tr.py, on the web configuration page). Same board, same pins.
[env:heltec_wireless_tracker_tr]
extends = env:heltec_wireless_tracker
build_flags =
	${env:heltec_wireless_tracker.build_flags}
	-I variants/heltec_wireless_tracker
	-D TB_LANG_TR
